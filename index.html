<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <title>VONLOVI</title>
    <meta
      name="description"
      content="Vonlovi, joaillerie sculpturale. FR / EN / JA"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" href="assets/logo-v-mark.png" />
    <meta property="og:title" content="VONLOVI" />
    <meta property="og:description" content="Vonlovi, joaillerie sculpturale. FR / EN / JA" />
    <meta property="og:url" content="https://vonlovi.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VONLOVI" />
    <meta property="og:image" content="https://vonlovi.vercel.app/assets/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="VONLOVI" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://vonlovi.vercel.app/assets/og-image.png?v=2" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="intro.css?v=7" />
    <style>
      body.page--intro.is-leaving .intro__stage {
        opacity: 0;
        transition: opacity 260ms ease;
      }
      body.page--intro.is-leaving .intro__field,
      body.page--intro.is-leaving .intro__veil {
        opacity: 0;
        transition: opacity 260ms ease;
      }
    </style>
    <script>
      /* Boot the device film ASAP so the request starts before other scripts. */
      (function () {
        var mobile = "assets/intro/bg-mobile.mp4?v=1";
        var desktop = "assets/intro/bg-desktop.mp4?v=1";
        var src =
          window.matchMedia && window.matchMedia("(max-width: 767px)").matches
            ? mobile
            : desktop;
        window.__VONLOVI_INTRO_SRC__ = src;
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "video";
        link.href = src;
        link.type = "video/mp4";
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body class="page--intro">
    <main class="intro" aria-label="VONLOVI">
      <div class="intro__field" aria-hidden="true">
        <div class="intro__texture"></div>
        <video
          class="intro__video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          data-intro-mobile="assets/intro/bg-mobile.mp4?v=1"
          data-intro-desktop="assets/intro/bg-desktop.mp4?v=1"
        ></video>
        <script>
          (function () {
            var el = document.currentScript.previousElementSibling;
            if (!el || el.tagName !== "VIDEO") return;
            var src =
              window.__VONLOVI_INTRO_SRC__ ||
              (window.matchMedia &&
              window.matchMedia("(max-width: 767px)").matches
                ? el.getAttribute("data-intro-mobile")
                : el.getAttribute("data-intro-desktop"));
            if (src) {
              el.src = src;
              el.load();
            }
          })();
        </script>
      </div>
      <div class="intro__veil" aria-hidden="true"></div>
      <div class="intro__stage">
        <img
          class="intro__logo"
          src="assets/logo-vonlovi-white.png?v=2"
          alt="VONLOVI"
          width="1024"
          height="421"
          decoding="sync"
          fetchpriority="high"
        />

        <ul class="intro__langs" role="list">
          <li>
            <button type="button" class="intro__lang" data-lang="fr" lang="fr" aria-label="Français">
              FR
            </button>
          </li>
          <li class="intro__sep" aria-hidden="true"></li>
          <li>
            <button type="button" class="intro__lang" data-lang="en" lang="en" aria-label="English">
              EN
            </button>
          </li>
          <li class="intro__sep" aria-hidden="true"></li>
          <li>
            <button type="button" class="intro__lang" data-lang="ja" lang="ja" aria-label="日本語">
              JA
            </button>
          </li>
        </ul>
      </div>
    </main>

    <script src="i18n.js?v=9"></script>
    <script src="cookies.js"></script>
    <script src="chrome.js?v=7"></script>
    <script src="intro.js?v=7"></script>
  </body>
</html>
