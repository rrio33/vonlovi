<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <title>Archives — VONLOVI</title>
    <meta
      name="description"
      content="Archives visuelles Vonlovi — visionneuse plein écran."
    />
    <link rel="icon" type="image/png" href="assets/logo-v-mark.png" />
    <meta property="og:title" content="Archives — VONLOVI" />
    <meta property="og:description" content="Archives visuelles Vonlovi — visionneuse plein écran." />
    <meta property="og:url" content="https://vonlovi.vercel.app/archives.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VONLOVI" />
    <meta property="og:image" content="https://vonlovi.vercel.app/assets/og-image.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="VONLOVI" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://vonlovi.vercel.app/assets/og-image.png?v=1" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="chrome.css?v=8" />
    <link rel="stylesheet" href="archives.css" />
  </head>
  <body class="page--archives">
    <div class="site-chrome" id="site-chrome">
      <header class="site-chrome__header">
        <div class="site-chrome__corner site-chrome__corner--tl site-chrome__corner--stack">
          <div class="site-shop" id="site-shop">
            <button
              type="button"
              class="site-chrome__link site-shop__trigger"
              aria-expanded="false"
              aria-controls="shop-panel"
              data-i18n="nav.shop"
            >
              Shop
            </button>
            <div class="site-shop__panel" id="shop-panel">
              <a href="collection.html?cat=pendentifs" data-i18n="shop.pendentifs">Pendentifs</a>
              <a href="collection.html?cat=bagues" data-i18n="shop.bagues">Bagues</a>
              <a href="collection.html?cat=boucles-d-oreilles" data-i18n="shop.boucles">Boucles d'oreille</a>
              <a href="collection.html?cat=boutons" data-i18n="shop.boutons">Boutons</a>
              <a href="collection.html?cat=bracelets" data-i18n="shop.bracelets">Bracelets</a>
            </div>
          </div>
          <a class="site-chrome__link" href="panier.html" data-cart-link>
            <span data-i18n="nav.panier">Panier</span> <span data-cart-count></span>
          </a>
        </div>
        <div class="site-chrome__corner site-chrome__corner--tr site-chrome__corner--stack site-chrome__corner--end">
          <a class="site-chrome__link" href="about.html" data-i18n="nav.about">About</a>
          <a class="site-chrome__link" href="press.html" data-i18n="nav.press">Press</a>
        </div>
        <a class="site-chrome__logo" href="home.html" data-i18n-aria="nav.logo" aria-label="VONLOVI — accueil">
          <span class="site-chrome__logo-word">
            <img
              class="site-chrome__logo-img site-chrome__logo-img--black site-chrome__logo-img--font"
              src="assets/logo-vonlovi-font-black.png"
              alt="VONLOVI"
              width="1200"
              height="494"
              decoding="async"
            />
            <img
              class="site-chrome__logo-img site-chrome__logo-img--white site-chrome__logo-img--font"
              src="assets/logo-vonlovi-font-white.png"
              alt=""
              width="1200"
              height="494"
              decoding="async"
              aria-hidden="true"
            />
          </span>
          <span class="site-chrome__logo-mark" aria-hidden="true">
            <img
              class="site-chrome__mark-img site-chrome__mark-img--black"
              src="assets/logo-mark-black.png"
              alt=""
              width="583"
              height="583"
              decoding="async"
            />
            <img
              class="site-chrome__mark-img site-chrome__mark-img--white"
              src="assets/logo-mark-white.png"
              alt=""
              width="583"
              height="583"
              decoding="async"
            />
            <img
              class="site-chrome__mark-img site-chrome__mark-img--burgundy"
              src="assets/logo-mark-burgundy.png"
              alt=""
              width="583"
              height="583"
              decoding="async"
            />
            <img
              class="site-chrome__mark-img site-chrome__mark-img--red"
              src="assets/logo-mark-red.png"
              alt=""
              width="583"
              height="583"
              decoding="async"
            />
            <img
              class="site-chrome__mark-img site-chrome__mark-img--purple"
              src="assets/logo-mark-purple.png"
              alt=""
              width="583"
              height="583"
              decoding="async"
            />
          </span>
        </a>
        <a class="site-chrome__link site-chrome__corner--bl" href="contributors.html" data-i18n="nav.regards">Regards</a>
        <a
          class="site-chrome__link site-chrome__corner--br"
          href="https://www.instagram.com/vonlovi/"
          target="_blank"
          rel="noopener noreferrer"
          >@vonlovi</a
        >
      </header>
    </div>

    <main
      class="archives-viewer"
      id="archives-viewer"
      aria-label="Archives"
      aria-roledescription="carousel"
      aria-busy="true"
    >
      <div class="archives-viewer__track" id="archives-track"></div>
      <button
        type="button"
        class="archives-viewer__hit archives-viewer__hit--prev"
        id="archives-prev"
        aria-label="Previous"
      ></button>
      <button
        type="button"
        class="archives-viewer__hit archives-viewer__hit--next"
        id="archives-next"
        aria-label="Next"
      ></button>
      <p class="archives-viewer__count" id="archives-count" aria-live="polite"></p>
    </main>

    <script src="i18n.js?v=4"></script>
    <script src="cart.js?v=3"></script>
    <script src="chrome.js?v=6" defer></script>
    <script src="archives.js?v=2" defer></script>
  </body>
</html>
